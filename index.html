<!DOCTYPE html>
<html>
<head>
  <title>HomeSync</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #f4f4f4;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      padding: 20px;
    }

    .card {
      background: white;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 10px;
    }

    button {
      padding: 10px;
      margin: 5px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header>
  <h1>🏠 HomeSync</h1>
  <p>Your home organisation app</p>
</header>

<div class="container">

  <div class="card">
    <h2>Dashboard</h2>
    <button>Rooms</button>
    <button>Planner</button>
    <button>Ideas</button>
  </div>

  <div class="card">
    <h2>Welcome</h2>
    <p>This is your HomeSync starting app 🚀</p>
  </div>

</div>

</body>
</html>
