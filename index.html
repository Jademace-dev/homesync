<!DOCTYPE html>
<html>
<head>
  <title>HomeSync</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, Arial;
      background: #f4f6fb;
      padding-bottom: 75px;
      -webkit-tap-highlight-color: transparent;
    }

    /* TOP BAR */
    .header {
      background: #0f0f10;
      color: white;
      padding: 16px;
      font-weight: 600;
      text-align: center;
      font-size: 16px;
      letter-spacing: 0.3px;
    }

    /* PAGES */
    .page {
      display: none;
      padding: 16px;
      animation: fade 0.25s ease;
    }

    .active {
      display: block;
    }

    @keyframes fade {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 {
      margin: 10px 0 15px;
      font-size: 22px;
    }

    /* CARDS */
    .card {
      background: white;
      padding: 14px;
      border-radius: 14px;
      margin-bottom: 10px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* INPUT */
    .input-box {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    input {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ddd;
      outline: none;
      font-size: 14px;
    }

    button {
      padding: 12px 14px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-weight: 600;
    }

    /* DELETE */
    .delete {
      background: #ff3b30;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
    }

    /* BOTTOM NAV (APP STYLE) */
    .nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      display: flex;
      justify-content: space-around;
      padding: 10px 0 8px;
      box-shadow: 0 -5px 20px rgba(0,0,0,0.08);
      border-top-left-radius: 18px;
      border-top-right-radius: 18px;
    }

    .tab {
      text-align: center;
      font-size: 11px;
      color: #777;
      flex: 1;
    }

    .tab span {
      display: block;
      font-size: 20px;
      margin-bottom: 2px;
    }

    .tab.active {
      color: #111;
      font-weight: 600;
    }

    .tab.active span {
      transform: scale(1.1);
    }
  </style>
</head>

<body>

<div class="header">🏠 HomeSync</div>

<!-- DASHBOARD -->
<div id="dashboard" class="page active">
  <h2>Dashboard</h2>
  <div class="card" id="summary"></div>
  <div class="card">Quick access to your home system 🚀</div>
</div>

<!-- ROOMS -->
<div id="rooms" class="page">
  <h2>Rooms</h2>

  <div class="input-box">
    <input id="roomInput" placeholder="Add a room...">
    <button onclick="addRoom()">Add</button>
  </div>

  <div id="roomList"></div>
</div>

<!-- PLANNER -->
<div id="planner" class="page">
  <h2>Planner</h2>
  <div class="card">✔ Clean kitchen</div>
  <div class="card">✔ Decor ideas</div>
  <div class="card">✔ Weekly goals</div>
</div>

<!-- IDEAS -->
<div id="ideas" class="page">
  <h2>Ideas</h2>
  <div class="card">Modern minimalist bedroom</div>
  <div class="card">Luxury living room setup</div>
  <div class="card">Organised kitchen layout</div>
</div>

<!-- BOTTOM NAV -->
<div class="nav">
  <div class="tab active" onclick="openPage('dashboard', this)">
    <span>🏠</span>Home
  </div>

  <div class="tab" onclick="openPage('rooms', this)">
    <span>🛋️</span>Rooms
  </div>

  <div class="tab" onclick="openPage('planner', this)">
    <span>📝</span>Planner
  </div>

  <div class="tab" onclick="openPage('ideas', this)">
    <span>💡</span>Ideas
  </div>
</div>

<script>
let rooms = JSON.parse(localStorage.getItem("rooms")) || ["Living Room", "Bedroom"];

function save() {
  localStorage.setItem("rooms", JSON.stringify(rooms));
}

/* PAGE SWITCH (APP FEEL) */
function openPage(page, el) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById(page).classList.add("active");

  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  el.classList.add("active");

  if (page === "rooms") renderRooms();
  if (page === "dashboard") updateDashboard();
}

/* DASHBOARD */
function updateDashboard() {
  document.getElementById("summary").innerText =
    "You have " + rooms.length + " rooms in your home system.";
}

/* ROOMS */
function renderRooms() {
  let list = document.getElementById("roomList");
  list.innerHTML = "";

  rooms.forEach((room, i) => {
    list.innerHTML += `
      <div class="card">
        ${room}
        <button class="delete" onclick="removeRoom(${i})">Delete</button>
      </div>
    `;
  });
}

function addRoom() {
  let input = document.getElementById("roomInput");

  if (input.value.trim() !== "") {
    rooms.push(input.value.trim());
    input.value = "";
    save();
    renderRooms();
    updateDashboard();
  }
}

function removeRoom(i) {
  rooms.splice(i, 1);
  save();
  renderRooms();
  updateDashboard();
}

/* INIT */
updateDashboard();
</script>

</body>
</html>
