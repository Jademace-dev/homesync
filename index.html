<div class="card">
  <b>Room Mode:</b><br><br>

  <button onclick="setRoomMode('build')">🧱 Build</button>
  <button onclick="setRoomMode('blueprint')">📏 Blueprint</button>
  <button onclick="setRoomMode('photo')">📷 Photo Mode</button>
</div>

<div class="card" id="blueprintControls" style="display:none;">
  Width (m): <input id="roomW" type="number" style="width:60px">
  Height (m): <input id="roomH" type="number" style="width:60px">
  <button onclick="applyBlueprint()">Apply</button>
</div>

<div class="card" id="photoControls" style="display:none;">
  Upload room photo:
  <input type="file" accept="image/*" onchange="setPhoto(event)">
</div>

<div class="card">
  <button onclick="exportRoom()">⬇ Export Room</button>
  <input type="file" onchange="importRoom(event)">
</div>
