<!DOCTYPE html>
<html>
<head>
  <title>HomeSync Designer Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #f4f6fb;
      padding-bottom: 70px;
    }

    .header {
      background: #111;
      color: white;
      padding: 15px;
      text-align: center;
      font-weight: bold;
    }

    .page { display: none; padding: 15px; }
    .active { display: block; }

    .card {
      background: white;
      padding: 12px;
      border-radius: 12px;
      margin-top: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
    }

    input, button {
      padding: 10px;
      border-radius: 8px;
      border: none;
      margin-top: 5px;
    }

    input { border: 1px solid #ccc; width: 65%; }

    button {
      background: #111;
      color: white;
      cursor: pointer;
    }

    /* CANVAS */
    .canvas {
      width: 100%;
      height: 60vh;
      background: #e7ebf5;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      margin-top: 10px;
    }

    /* GRID */
    .grid {
      position: absolute;
      width: 100%;
      height: 100%;
      background-image:
        linear-gradient(#d9deea 1px, transparent 1px),
        linear-gradient(90deg, #d9deea 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.4;
    }

    .item {
      position: absolute;
      padding: 8px 10px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.15);
      font-size: 12px;
      cursor: grab;
      user-select: none;
      z-index: 2;
      transition: 0.05s;
    }

    /* SELECTED ITEM */
    .selected {
      outline: 2px solid #4a90e2;
    }

    .toolbar button {
      margin-right: 5px;
    }
  </style>
</head>

<body>

<div class="header">🏠 HomeSync Designer Pro</div>

<!-- HOME -->
<div id="home" class="page active">
  <h2>Rooms</h2>

  <input id="roomInput" placeholder="Add room...">
  <button onclick="addRoom()">Add</button>

  <div id="roomList"></div>
</div>

<!-- DESIGNER -->
<div id="designer" class="page">
  <button onclick="back()">⬅ Back</button>
  <h2 id="roomTitle"></h2>

  <div class="card toolbar">
    <b>Items</b><br>
    <button onclick="selectItem('Sofa')">🛋️ Sofa</button>
    <button onclick="selectItem('Bed')">🛏️ Bed</button>
    <button onclick="selectItem('Table')">🪑 Table</button>
    <button onclick="selectItem('Plant')">🪴 Plant</button>
  </div>

  <div class="card">
    <button onclick="rotateItem()">🔄 Rotate</button>
    <button onclick="deleteItem()">🗑 Delete</button>
    <button onclick="clearSelection()">❌ Deselect</button>
  </div>

  <div class="canvas" id="canvas">
    <div class="grid"></div>
  </div>
</div>

<script>
let rooms = JSON.parse(localStorage.getItem("rooms")) || ["Living Room"];
let data = JSON.parse(localStorage.getItem("data")) || {};

let current = null;
let selected = null;
let selectedIndex = null;
let drag = null;

/* SAVE */
function save() {
  localStorage.setItem("rooms", JSON.stringify(rooms));
  localStorage.setItem("data", JSON.stringify(data));
}

/* ROOMS */
function addRoom() {
  let v = document.getElementById("roomInput").value;
  if (!v) return;

  rooms.push(v);
  save();
  renderRooms();
}

function renderRooms() {
  let list = document.getElementById("roomList");
  list.innerHTML = "";

  rooms.forEach(r => {
    let d = document.createElement("div");
    d.className = "card";
    d.innerText = r;
    d.onclick = () => openRoom(r);
    list.appendChild(d);
  });
}

/* OPEN ROOM */
function openRoom(name) {
  current = name;

  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById("designer").classList.add("active");

  document.getElementById("roomTitle").innerText = name;

  if (!data[name]) data[name] = [];

  renderCanvas();
}

/* SELECT ITEM TO PLACE */
function selectItem(name) {
  selected = name;
}

/* CLEAR SELECTION */
function clearSelection() {
  selectedIndex = null;
  renderCanvas();
}

/* CANVAS */
function renderCanvas() {
  let c = document.getElementById("canvas");
  c.innerHTML = '<div class="grid"></div>';

  data[current].forEach((it, i) => {
    let el = document.createElement("div");
    el.className = "item";
    el.innerText = it.name;

    el.style.left = snap(it.x) + "px";
    el.style.top = snap(it.y) + "px";
    el.style.transform = `rotate(${it.rot || 0}deg)`;

    /* SELECT ITEM */
    if (selectedIndex === i) {
      el.classList.add("selected");
    }

    el.onclick = (e) => {
      selectedIndex = i;
      renderCanvas();
      e.stopPropagation();
    };

    /* DRAG */
    el.onmousedown = (e) => {
      drag = { i, ox: e.offsetX, oy: e.offsetY };
    };

    c.appendChild(el);
  });

  /* PLACE ITEM */
  c.onclick = (e) => {
    if (!selected) return;

    let r = c.getBoundingClientRect();

    data[current].push({
      name: selected,
      x: snap(e.clientX - r.left),
      y: snap(e.clientY - r.top),
      rot: 0
    });

    selected = null;
    save();
    renderCanvas();
  };

  /* CLICK EMPTY SPACE = DESELECT */
  c.addEventListener("click", () => {
    selectedIndex = null;
    renderCanvas();
  });
}

/* SNAP GRID */
function snap(v) {
  return Math.round(v / 20) * 20;
}

/* DRAG MOVE */
document.addEventListener("mousemove", e => {
  if (!drag) return;

  let c = document.getElementById("canvas");
  let r = c.getBoundingClientRect();

  let item = data[current][drag.i];

  item.x = snap(e.clientX - r.left - drag.ox);
  item.y = snap(e.clientY - r.top - drag.oy);

  save();
  renderCanvas();
});

document.addEventListener("mouseup", () => drag = null);

/* ROTATE */
function rotateItem() {
  if (selectedIndex === null) return;

  let item = data[current][selectedIndex];
  item.rot = (item.rot || 0) + 90;

  save();
  renderCanvas();
}

/* DELETE */
function deleteItem() {
  if (selectedIndex === null) return;

  data[current].splice(selectedIndex, 1);
  selectedIndex = null;

  save();
  renderCanvas();
}

/* BACK */
function back() {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById("home").classList.add("active");
  renderRooms();
}

/* INIT */
renderRooms();
</script>

</body>
</html>
